<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Biological text NER output</title><desc id="d">A literature abstract with gene and species entities highlighted.</desc><rect width="1600" height="900" fill="#f8f6f1"/><text x="105" y="112" fill="#202a39" font-family="Arial,sans-serif" font-size="42" font-weight="700">NER for Biological Text</text><text x="105" y="157" fill="#6e7784" font-family="Arial,sans-serif" font-size="23">spaCy entity extraction from arthropod literature</text><rect x="105" y="225" width="1390" height="492" rx="20" fill="#fff" stroke="#ddd8ce" stroke-width="3"/><g font-family="Georgia,serif" font-size="28" fill="#263140"><text x="165" y="310">Primary structure of</text><rect x="421" y="278" width="286" height="45" rx="7" fill="#fee1a8"/><text x="436" y="310">apolipophorin-III</text><rect x="587" y="244" width="120" height="27" rx="6" fill="#e5a23a"/><text x="603" y="264" fill="#fff" font-family="Arial,sans-serif" font-size="15" font-weight="700">GENE</text><text x="721" y="310">from the migratory locust,</text><rect x="1122" y="278" width="276" height="45" rx="7" fill="#ccebe4"/><text x="1137" y="310" font-style="italic">Locusta migratoria</text><rect x="1290" y="244" width="108" height="27" rx="6" fill="#3d9c87"/><text x="1303" y="264" fill="#fff" font-family="Arial,sans-serif" font-size="15" font-weight="700">SPECIES</text><text x="165" y="382">Potential amphipathic structures and molecular evolution of an</text><text x="165" y="454">insect apolipoprotein. Expression of</text><rect x="648" y="422" width="118" height="45" rx="7" fill="#fee1a8"/><text x="663" y="454">apoLp-III</text><rect x="676" y="388" width="90" height="27" rx="6" fill="#e5a23a"/><text x="690" y="408" fill="#fff" font-family="Arial,sans-serif" font-size="15" font-weight="700">GENE</text><text x="780" y="454">was detected in</text><rect x="1002" y="422" width="300" height="45" rx="7" fill="#ccebe4"/><text x="1017" y="454" font-style="italic">Manduca sexta</text><rect x="1194" y="388" width="108" height="27" rx="6" fill="#3d9c87"/><text x="1207" y="408" fill="#fff" font-family="Arial,sans-serif" font-size="15" font-weight="700">SPECIES</text><text x="1316" y="454">.</text><text x="165" y="526">The annotated corpus is converted from BioC XML into spaCy spans,</text><text x="165" y="598">preserving character offsets for model training and evaluation.</text></g><g font-family="Arial,sans-serif"><rect x="105" y="772" width="207" height="55" rx="27" fill="#fee1a8"/><text x="151" y="807" fill="#9b6310" font-size="21" font-weight="700">GENE · 2</text><rect x="338" y="772" width="230" height="55" rx="27" fill="#ccebe4"/><text x="379" y="807" fill="#287966" font-size="21" font-weight="700">SPECIES · 2</text><text x="1200" y="807" fill="#6e7784" font-size="21">BioC XML → spaCy</text></g></svg>
